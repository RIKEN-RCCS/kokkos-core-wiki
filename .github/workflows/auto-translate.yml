name: Auto-translate to Japanese

on:
  push:
    branches: [main]
    paths:
      - 'docs/source/**/*.rst'
      - 'docs/source/*.rst'
      - 'docs/source/**/*.md'
      - 'docs/source/*.md'
  workflow_dispatch:
    inputs:
      before_sha:
        description: 'Base commit SHA to diff from (exclusive)'
        required: true
      after_sha:
        description: 'Target commit SHA to diff to (inclusive)'
        required: true

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve SHA range
        id: shas
        run: |
          echo "before=${{ github.event.inputs.before_sha || github.event.before }}" >> "$GITHUB_OUTPUT"
          echo "after=${{ github.event.inputs.after_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          fetch-depth: 0

      - name: Checkout Japanese branch
        uses: actions/checkout@v4
        with:
          ref: Japanese
          path: japanese-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "anthropic[bedrock]"

      - name: Translate changed RST files
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: |
          python main-repo/.github/scripts/translate_changes.py \
            --main-dir main-repo \
            --japanese-dir japanese-repo \
            --before-sha ${{ steps.shas.outputs.before }} \
            --after-sha ${{ steps.shas.outputs.after }}

      # PRs opened with GITHUB_TOKEN don't trigger pull_request workflows, so
      # check here that the translated docs still build (with -W, like
      # deploy_docs_ja.yml) and flag the PR if they don't.
      - name: Install docs build dependencies
        run: |
          pip install -r japanese-repo/build_requirements.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz

      - name: Build translated docs
        id: build
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          # Build outside japanese-repo so nothing ends up in the commit.
          sphinx-build -b html japanese-repo/docs/source "$RUNNER_TEMP/ja-html" -W --keep-going \
            2>&1 | tee "$RUNNER_TEMP/sphinx.log"

      - name: Create pull request
        working-directory: japanese-repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          BRANCH="auto-translate/main-${{ steps.shas.outputs.after }}"
          git checkout -b "$BRANCH"
          git commit -m "Auto-translate: sync with main ${{ steps.shas.outputs.after }}"
          # --force: a manual re-run (workflow_dispatch) targeting the same
          # after_sha as a previous run must overwrite that run's branch, e.g.
          # to regenerate a PR after fixing a bug in translate_changes.py.
          git push origin "$BRANCH" --force

          BODY="Triggered by [${{ steps.shas.outputs.after }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.shas.outputs.after }})"
          DRAFT=()
          if [ "$BUILD_OUTCOME" != "success" ]; then
            echo "::warning::Translated docs fail to build; opening the PR as a draft."
            BUILD_REPORT=$(printf '%s\n\n%s\n\n```\n%s\n```\n' \
              ":warning: **The translated docs fail to build** (\`sphinx-build -W\`). Fix these before merging; see [the workflow run]($BUILD_RUN_URL) for the full log." \
              "Warnings/errors:" \
              "$(grep -E 'WARNING|ERROR|build finished' "$RUNNER_TEMP/sphinx.log" | sed "s|$GITHUB_WORKSPACE/japanese-repo/||" | head -n 50)")
            BODY="$BODY"$'\n\n'"$BUILD_REPORT"
            DRAFT=(--draft)
          fi

          # gh pr view finds PRs regardless of state, so check state explicitly:
          # a closed/merged PR for this branch must not block creating a new one.
          STATE=$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null || true)
          if [ "$STATE" = "OPEN" ]; then
            echo "Open PR already exists for $BRANCH; branch updated in place."
            if [ "$BUILD_OUTCOME" != "success" ]; then
              gh pr comment "$BRANCH" --body "$BUILD_REPORT"
            fi
            exit 0
          fi
          gh pr create \
            --base Japanese \
            --head "$BRANCH" \
            --title "Auto-translate: sync with main $(date -u +%Y-%m-%d)" \
            --body "$BODY" \
            "${DRAFT[@]}"
